name: Daily-A-Share-Report

on:
  schedule:
    # 北京时间周一到周五 14:30 → UTC 6:30
    - cron: '30 8 * * 1-5'   # UTC 8:30 = 北京 16:30
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug akshare functions
        run: python -c "import akshare as ak; funcs=[x for x in dir(ak) if 'board' in x or 'fund_flow' in x or 'north' in x or 'dzjy' in x]; print('可用函数列表:'); print('\n'.join(funcs))"

      - name: Run fetch
        run: python scripts/fetch_data.py

      - name: Run analyze
        run: python scripts/analyze.py

      - name: Build report
        run: python scripts/build_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update report $(date +'%Y-%m-%d')" && git push)
